<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create an Account | SpendWise Expense Tracker</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">

  <!-- Immediate Authentication Check (Prevents showing register if already logged in) -->
  <script>
    (function () {
      const currentUser = localStorage.getItem("spendwise_current_user");
      if (currentUser) {
        window.location.replace("index.html");
      }
    })();
  </script>

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/register.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-container">

      <!-- Register Card -->
      <div class="auth-card">

        <!-- Card Header -->
        <div class="auth-header">
          <a href="register.html" class="auth-brand">
            <img src="assets/images/logo.svg" alt="SpendWise Logo" class="brand-icon">
            <span>SpendWise</span>
            <span class="brand-badge">Tracker</span>
          </a>
          <h1 class="auth-title">Create an Account</h1>
          <p class="auth-subtitle">Join SpendWise to track expenses, manage budgets, and grow your savings.</p>
        </div>

        <!-- Error Alert -->
        <div id="auth-error" class="auth-alert auth-alert-danger" style="display: none;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span id="auth-error-text">Please resolve the form errors.</span>
        </div>

        <!-- Registration Form -->
        <form id="register-form" novalidate>

          <!-- Full Name Field -->
          <div class="form-group">
            <label for="reg-name" class="form-label">
              Full Name <span class="required">*</span>
            </label>
            <div class="input-with-icon">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
              </span>
              <input
                type="text"
                id="reg-name"
                class="form-control"
                placeholder="e.g. Alex Johnson"
                required
                autocomplete="name"
              >
            </div>
          </div>

          <!-- Email Address Field -->
          <div class="form-group">
            <label for="reg-email" class="form-label">
              Email Address <span class="required">*</span>
            </label>
            <div class="input-with-icon">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                  <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
              </span>
              <input
                type="email"
                id="reg-email"
                class="form-control"
                placeholder="name@example.com"
                required
                autocomplete="email"
              >
            </div>
          </div>

          <!-- Password Field -->
          <div class="form-group">
            <label for="reg-password" class="form-label">
              Password <span class="required">*</span>
            </label>
            <div class="input-with-icon input-password-wrapper">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </span>
              <input
                type="password"
                id="reg-password"
                class="form-control"
                placeholder="At least 6 characters"
                minlength="6"
                required
                autocomplete="new-password"
              >
              <button
                type="button"
                id="toggle-reg-password"
                class="btn-toggle-password"
                aria-label="Toggle password visibility"
              >
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
            <div class="form-helper">Password must be at least 6 characters long.</div>
          </div>

          <!-- Confirm Password Field -->
          <div class="form-group">
            <label for="reg-confirm-password" class="form-label">
              Confirm Password <span class="required">*</span>
            </label>
            <div class="input-with-icon input-password-wrapper">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                </svg>
              </span>
              <input
                type="password"
                id="reg-confirm-password"
                class="form-control"
                placeholder="Re-enter your password"
                required
                autocomplete="new-password"
              >
              <button
                type="button"
                id="toggle-reg-confirm"
                class="btn-toggle-password"
                aria-label="Toggle password visibility"
              >
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
            <div id="match-indicator" class="match-indicator" style="display: none;"></div>
          </div>

          <!-- Submit Button -->
          <button type="submit" id="register-submit-btn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="8.5" cy="7" r="4"></circle>
              <line x1="20" y1="8" x2="20" y2="14"></line>
              <line x1="23" y1="11" x2="17" y2="11"></line>
            </svg>
            <span>Create Account</span>
          </button>

        </form>

        <!-- Auth Footer Link -->
        <div class="auth-footer">
          Already have an account? <a href="login.html">&larr; Sign In</a>
        </div>

      </div>

      <!-- Page Bottom Info -->
      <div class="auth-page-footer">
        <strong>SpendWise</strong> &mdash; All user data saved locally in your browser.
      </div>

    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Register JavaScript -->
  <script src="js/register.js"></script>
</body>
</html>
